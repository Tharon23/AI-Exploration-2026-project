[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-exploration-2026"
version = "0.1.0"
description = "AI Exploration 2026 project at AGH UST (Cybersecurity 3rd year)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Kalab" },
    { name = "Bartek" },
    { name = "Kamil" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.4.0",
    "ruff>=0.4.0",
    "pytest>=8.2.0",
]
models = [
    "openai>=1.30.0",
    "anthropic>=0.28.0",
    "google-genai>=0.1.1",
]
local = [
    "ollama>=0.2.0",
    "onnxruntime>=1.18.0",
]
